name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.1', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax
        run: find . -name '*.php' -not -path './build/*' -print0 | xargs -0 -n1 php -l

  plugin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: bin/build.sh
      - name: Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: build/hikashop-for-elementor
          include-experimental: true
          include-low-severity-errors: true
          include-low-severity-warnings: true
          strict: true
      - uses: actions/upload-artifact@v4
        with:
          name: hikashop-for-elementor
          path: build/hikashop-for-elementor.zip
